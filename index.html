    <p class="modal-eyebrow">A LETTER FOR YOUR NINETEEN</p>
    <h2 id="letter-title">\u5199\u7ED9\u5341\u4E5D\u5C81</h2>
    <div class="letter-content"><p>\u751F\u65E5\u5FEB\u4E50\u5440\u3002</p><p>\u5341\u4E5D\u5C81\uFF0C\u662F\u4E00\u9635\u521A\u521A\u597D\u7684\u98CE\u3002\u4F60\u53EF\u4EE5\u5954\u8DD1\uFF0C\u53EF\u4EE5\u7ED5\u8DEF\uFF0C\u4E5F\u53EF\u4EE5\u5076\u5C14\u505C\u4E0B\u6765\uFF0C\u770B\u770B\u4ECA\u665A\u7684\u6708\u4EAE\u3002</p><p>\u613F\u4F60\u6709\u63A2\u7D22\u4E16\u754C\u7684\u52C7\u6C14\uFF0C\u4E5F\u6709\u505A\u81EA\u5DF1\u7684\u5E95\u6C14\u3002\u613F\u559C\u6B22\u7684\u4E8B\u90FD\u6709\u56DE\u54CD\uFF0C\u613F\u5728\u610F\u7684\u4EBA\u90FD\u5728\u8EAB\u65C1\u3002</p><p>\u4E0D\u5FC5\u6025\u7740\u6210\u4E3A\u8C01\u773C\u4E2D\u7684\u5927\u4EBA\u3002<br>\u6162\u6162\u6765\uFF0C\u4F60\u7684\u82B1\u4F1A\u6309\u81EA\u5DF1\u7684\u65F6\u8282\u76DB\u5F00\u3002</p><p class="letter-ending">\u65B0\u7684\u4E00\u5C81\uFF0C\u8BF7\u5C3D\u60C5\u95EA\u8000\u3002<span>\u6574\u4E2A\u5B87\u5B99\uFF0C\u90FD\u5728\u4E3A\u4F60\u5E86\u795D \u2727</span></p></div>
    <button class="primary-button" id="celebrate"><span>\u5E26\u7740\u795D\u798F\uFF0C\u51FA\u53D1\u5427</span><span aria-hidden="true">\u2726</span></button>
  </dialog>

  <noscript><div class="no-script">\u5341\u4E5D\u5C81\u751F\u65E5\u5FEB\u4E50\uFF01\u8BF7\u5F00\u542F JavaScript\uFF0C\u4F53\u9A8C\u4E3A\u4F60\u70B9\u4EAE\u7684\u751F\u65E5\u7C92\u5B50\u661F\u7A7A\u3002</div></noscript>
<script>
(() => {
  'use strict';
  const $ = (selector) => document.querySelector(selector);
  const canvas = $('#particles');
  const ctx = canvas.getContext('2d', { alpha: true });
  const mask = document.createElement('canvas');
  const mctx = mask.getContext('2d', { willReadFrequently: true });
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  const mobile = () => window.innerWidth <= 650;
  let shape = 'nineteen', width = 0, height = 0, lastTime = 0, clock = 0;
  let particles = [], stars = [], galaxy = [], meteors = [], fireworks = [], frame = 0, resizeTimer, toastTimer;
  let pointer = { x: -9999, y: -9999, active: false, down: false, startX: 0, startY: 0 };
  const colors = ['#e7d8ff','#d0b6ff','#b9c9ff','#e6b9ef','#9bd6f2','#f8d4eb','#fff1db'];
  const random = (min, max) => min + Math.random() * (max - min);
  const captions = {
    galaxy: '\u5B87\u5B99\u6D69\u701A\uFF0C\u4F60\u662F\u6700\u7279\u522B\u7684\u5B58\u5728\u3002',
    nineteen: '\u7B2C\u5341\u4E5D\u6B21\u73AF\u6E38\u592A\u9633\uFF0C\u4E00\u5207\u7F8E\u597D\u6B63\u5728\u53D1\u751F\u3002',
    heart: '\u613F\u4F60\u88AB\u7231\uFF0C\u4E5F\u52C7\u6562\u53BB\u7231\u3002',
    cake: '\u5439\u706D\u8721\u70DB\uFF0C\u8BA9\u7F8E\u597D\u7684\u4E8B\u60C5\u53D1\u751F\u3002'
  };
  const announce = (message) => {
    const el = $('#toast'); el.textContent = message; el.classList.add('visible');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('visible'), 3400);
  };

  function getScene() {
    const box = $('.birthday-stage').getBoundingClientRect();
    return { x: width / 2, y: box.top + box.height * .405, w: Math.min(mobile() ? width * .79 : width * .43, 610), h: Math.min(box.height * .48, 340) };
  }

  function targets() {
    if (shape === 'galaxy') return [];
    const scene = getScene();
    mask.width = 1000; mask.height = 600;
    mctx.clearRect(0, 0, 1000, 600);
    mctx.fillStyle = '#fff'; mctx.strokeStyle = '#fff';
    if (shape === 'nineteen') {
      mctx.font = 'bold 570px Georgia, "Times New Roman", serif';
      mctx.textAlign = 'center'; mctx.textBaseline = 'alphabetic';
      mctx.fillText('19', 492, 475);
    } else if (shape === 'heart') {
      mctx.beginPath(); mctx.moveTo(500, 530);
      mctx.bezierCurveTo(420, 455, 180, 300, 205, 165);
      mctx.bezierCurveTo(225, 20, 420, 15, 500, 150);
      mctx.bezierCurveTo(580, 15, 775, 20, 795, 165);
      mctx.bezierCurveTo(820, 300, 580, 455, 500, 530); mctx.fill();
    } else if (shape === 'cake') {
      mctx.lineWidth = 18; mctx.lineJoin = 'round'; mctx.lineCap = 'round';
      mctx.beginPath(); mctx.roundRect(235, 280, 530, 215, 18); mctx.stroke();
      mctx.beginPath(); mctx.moveTo(200, 515); mctx.lineTo(800, 515); mctx.stroke();
      mctx.beginPath(); mctx.moveTo(237, 342);
      for (let i = 0; i < 5; i++) mctx.bezierCurveTo(237 + i * 105 + 26, 425, 237 + i * 105 + 79, 265, 237 + (i + 1) * 105, 342);
      mctx.stroke();
      [355, 500, 645].forEach((x) => {
        mctx.fillRect(x - 15, 180, 30, 100);
        mctx.beginPath(); mctx.moveTo(x, 80); mctx.bezierCurveTo(x - 52, 135, x - 35, 160, x, 160); mctx.bezierCurveTo(x + 35, 160, x + 42, 132, x, 80); mctx.fill();
      });
      mctx.font = 'bold 93px Georgia, serif'; mctx.textAlign = 'center'; mctx.fillText('19', 500, 466);
    }
    const data = mctx.getImageData(0, 0, 1000, 600).data;
    const points = []; let minX = 1000, maxX = 0, minY = 600, maxY = 0;
    const step = shape === 'cake' ? 5 : 6;
    for (let y = 0; y < 600; y += step) {
      for (let x = 0; x < 1000; x += step) {
        if (data[(y * 1000 + x) * 4 + 3] > 130) {
          points.push({ x, y }); minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y);
        }
      }
    }
    if (!points.length) return [{ x: scene.x, y: scene.y }];
    const scale = Math.min(scene.w / (maxX - minX), scene.h / (maxY - minY));
    for (let i = points.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1)); [points[i], points[j]] = [points[j], points[i]];
    }
    return points.map(p => ({ x: scene.x + (p.x - (minX + maxX) / 2) * scale, y: scene.y + (p.y - (minY + maxY) / 2) * scale }));
  }

  function formParticles(initial = false) {
    const points = targets();
    const count = shape === 'galaxy' ? 0 : reduced.matches ? 650 : mobile() ? 1400 : 2300;
    const scene = getScene();
    particles = Array.from({ length: count }, (_, i) => {
      const p = points[i % points.length]; const old = particles[i];
      const angle = random(0, Math.PI * 2); const radius = random(50, width * .47);
      return {
        x: old?.x ?? (reduced.matches ? p.x : scene.x + Math.cos(angle) * radius),
        y: old?.y ?? (reduced.matches ? p.y : scene.y + Math.sin(angle) * radius),
        tx: p.x + random(-1, 1), ty: p.y + random(-1, 1),
        vx: old?.vx ?? 0, vy: old?.vy ?? 0,
        size: random(.6, mobile() ? 1.5 : 1.85), alpha: random(.38, 1),
        color: colors[Math.floor(Math.random() * colors.length)], phase: random(0, Math.PI * 2),
        depth: random(.3, 1), glow: i % 17 === 0
      };
    });
    if (initial && !reduced.matches) particles.forEach(p => { p.vx = random(-2, 2); p.vy = random(-2, 2); });
  }

  function resize() {
    width = window.innerWidth; height = $('#universe').clientHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
    canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = Array.from({ length: mobile() ? 220 : 460 }, () => ({ x: random(0, width), y: random(0, height), size: random(.25, 1.4), alpha: random(.12, .8), phase: random(0, 7) }));
    galaxy = Array.from({ length: reduced.matches ? 1100 : mobile() ? 2200 : 3800 }, (_, i) => {
      const r = Math.pow(Math.random(), .7), angle = (i % 4) * Math.PI * .5 + r * 6.8 + random(-.24, .24);
      return { x: Math.cos(angle) * r, z: Math.sin(angle) * r, y: random(-.042, .042) * (1.2 - r), size: random(.3, 1.45), alpha: random(.15, .8), color: ['#d3c4ff','#b7b5ff','#869deb','#e1c2e7','#86c2ee','#f0e6ff'][i % 6] };
    });
    formParticles(particles.length === 0);
    if (mobile()) $('#interaction-tip').innerHTML = '\u6ED1\u52A8\u6307\u5C16\uFF0C\u62E8\u52A8\u661F\u6CB3<br><small>\u8F7B\u70B9\u7A7A\u767D\u5904\uFF0C\u7EFD\u653E\u70DF\u82B1</small>';
    else $('#interaction-tip').innerHTML = '\u79FB\u52A8\u9F20\u6807\uFF0C\u62E8\u52A8\u661F\u6CB3<br><small>\u70B9\u51FB\u7A7A\u767D\u5904\uFF0C\u7EFD\u653E\u4E00\u573A\u70DF\u82B1</small>';
  }

  function drawPlanet(x, y, radius, ringed) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(-.38);
    const halo = ctx.createRadialGradient(0, 0, radius * .8, 0, 0, radius * 1.5);
    halo.addColorStop(0, ringed ? '#8b79e921' : '#69a1d524'); halo.addColorStop(1, '#07091400');
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(0, 0, radius * 1.5, 0, Math.PI * 2); ctx.fill();
    if (ringed) {
      ctx.strokeStyle = '#a29ad760'; ctx.lineWidth = radius * .12;
      ctx.beginPath(); ctx.ellipse(0, 0, radius * 2.15, radius * .48, 0, Math.PI, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = '#c2b4df26'; ctx.lineWidth = radius * .28;
      ctx.beginPath(); ctx.ellipse(0, 0, radius * 2, radius * .45, 0, Math.PI, Math.PI * 2); ctx.stroke();
    }
    const planet = ctx.createRadialGradient(-radius * .44, -radius * .48, 0, radius * .2, radius * .2, radius * 1.3);
    planet.addColorStop(0, ringed ? '#c3b3e5' : '#719bbf'); planet.addColorStop(.3, ringed ? '#8070aa' : '#3a5d82'); planet.addColorStop(.63, ringed ? '#3f355e' : '#192c4c'); planet.addColorStop(1, '#070a17');
    ctx.fillStyle = planet; ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, radius - .6, 0, Math.PI * 2); ctx.clip();
    for (let i = -3; i <= 4; i++) {
      ctx.strokeStyle = i % 2 ? '#b6a5e210' : '#0d0d271f'; ctx.lineWidth = radius * .12;
      ctx.beginPath(); ctx.ellipse(-radius * .15, i * radius * .26, radius * 1.6, radius * .23, 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
    if (ringed) {
      for (let i = 0; i < 5; i++) { ctx.strokeStyle = ['#b6a6d953','#c1b5e235','#7369a480','#e3d3fb30','#8c83b936'][i]; ctx.lineWidth = radius * .075;
        ctx.beginPath(); ctx.ellipse(0, 0, radius * (1.65 + i * .13), radius * (.36 + i * .03), 0, 0, Math.PI); ctx.stroke(); }
    }
    ctx.restore();
  }

  function drawUniverse(dt) {
    const scene = getScene(), radius = mobile() ? width * .68 : Math.min(width * .39, 620);
    const centerY = scene.y + (mobile() ? 8 : 12);
    const rotation = reduced.matches ? .35 : clock * .027 + .35;
    const tilt = pointer.active && !reduced.matches ? (pointer.y / height - .45) * .09 : 0;
    ctx.save(); ctx.translate(scene.x, centerY); ctx.rotate(-.3);
    ctx.scale(1, .40 + tilt);
    const haze = ctx.createRadialGradient(0, 0, 0, 0, 0, radius);
    haze.addColorStop(0, '#e8ceff30'); haze.addColorStop(.09, '#b3a1ff38'); haze.addColorStop(.3, '#7157b52c'); haze.addColorStop(.65, '#403b8c1b'); haze.addColorStop(1, '#151c4500');
    ctx.fillStyle = haze; ctx.fillRect(-radius, -radius, radius * 2, radius * 2); ctx.restore();
    ctx.globalCompositeOperation = 'lighter';
    const cos = Math.cos(rotation), sin = Math.sin(rotation), alpha = shape === 'galaxy' ? 1 : .32;
    for (const g of galaxy) {
      const gx = (g.x * cos - g.z * sin) * radius, gz = (g.x * sin + g.z * cos) * radius;
      const gy = gz * (.40 + tilt) + g.y * radius;
      const x = scene.x + gx * .955 + gy * .296, y = centerY - gx * .296 + gy * .955;
      ctx.globalAlpha = g.alpha * alpha; ctx.fillStyle = g.color;
      ctx.beginPath(); ctx.arc(x, y, g.size * (mobile() ? .8 : 1), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    const planetDrift = reduced.matches ? 0 : Math.sin(clock * .22) * 5;
    drawPlanet(scene.x + (mobile() ? width * .345 : radius * .83), scene.y - (mobile() ? 112 : 96) + planetDrift, mobile() ? 22 : 38, true);
    drawPlanet(scene.x - (mobile() ? width * .37 : radius * .88), scene.y + (mobile() ? 78 : 82) - planetDrift, mobile() ? 14 : 25, false);
    if (!reduced.matches && Math.random() < .004 * dt && meteors.length < 2) meteors.push({ x: random(width * .25, width), y: random(height * .13, height * .4), life: 1 });
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i]; m.x -= 8 * dt; m.y += 3.5 * dt; m.life -= .013 * dt;
      if (m.life <= 0) { meteors.splice(i, 1); continue; }
      const trail = ctx.createLinearGradient(m.x, m.y, m.x + 80, m.y - 35); trail.addColorStop(0, '#e9e2ff'); trail.addColorStop(1, '#b8aaff00');
      ctx.globalAlpha = Math.sin(m.life * Math.PI) * .7; ctx.strokeStyle = trail; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x + 80, m.y - 35); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function burst(x, y, count = 90) {
    const limit = reduced.matches ? 20 : count;
    for (let i = 0; i < limit; i++) {
      const angle = random(0, Math.PI * 2); const speed = random(1.2, 6);
      fireworks.push({ x, y, px: x, py: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1, decay: random(.009, .018), color: colors[Math.floor(Math.random() * colors.length)], size: random(.7, 1.9) });
    }
    if (fireworks.length > 850) fireworks.splice(0, fireworks.length - 850);
  }

  function celebrate() {
    const scene = getScene();
    if (!reduced.matches) particles.forEach(p => { const angle = Math.atan2(p.y - scene.y, p.x - scene.x); p.vx += Math.cos(angle) * random(6, 19); p.vy += Math.sin(angle) * random(6, 19); });
    burst(width * .28, height * .32, 120);
    setTimeout(() => burst(width * .72, height * .29, 120), 220);
    setTimeout(() => burst(width * .5, height * .4, 130), 480);
  }

  function render(time) {
    const dt = Math.min((time - (lastTime || time - 16.7)) / 16.7, 2); lastTime = time; clock += dt * .0167;
    ctx.clearRect(0, 0, width, height);
    for (const star of stars) {
      ctx.globalAlpha = star.alpha * (reduced.matches ? .7 : .65 + Math.sin(clock * .8 + star.phase) * .35);
      ctx.fillStyle = '#bfbada'; ctx.beginPath(); ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2); ctx.fill();
      if (star.size > 1.2) { ctx.globalAlpha *= .35; ctx.fillRect(star.x - 3.5, star.y - .35, 7, .7); ctx.fillRect(star.x - .35, star.y - 3.5, .7, 7); }
    }
    ctx.globalAlpha = 1;
    drawUniverse(dt);
    const breathe = reduced.matches ? 0 : Math.sin(clock * .7) * 1.6;
    ctx.globalCompositeOperation = 'lighter';
    for (const p of particles) {
      const drift = reduced.matches ? 0 : Math.sin(clock * 1.3 + p.phase) * 1.2;
      const targetX = p.tx + drift, targetY = p.ty + breathe + drift * .5;
      if (!reduced.matches) {
        p.vx += (targetX - p.x) * .013 * dt; p.vy += (targetY - p.y) * .013 * dt;
        if (pointer.active) {
          const dx = p.x - pointer.x, dy = p.y - pointer.y, distance = Math.hypot(dx, dy), radius = mobile() ? 65 : 105;
          if (distance < radius && distance > .1) { const force = Math.pow(1 - distance / radius, 2) * 3.7; p.vx += dx / distance * force * dt; p.vy += dy / distance * force * dt; }
        }
        p.vx *= Math.pow(.88, dt); p.vy *= Math.pow(.88, dt); p.x += p.vx * dt; p.y += p.vy * dt;
      } else { p.x += (p.tx - p.x) * Math.min(.18 * dt, 1); p.y += (p.ty - p.y) * Math.min(.18 * dt, 1); }
      ctx.globalAlpha = p.alpha * (reduced.matches ? .85 : .78 + Math.sin(clock * 1.8 + p.phase) * .22);
      ctx.fillStyle = p.color;
      if (p.glow) { ctx.globalAlpha *= .12; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 4.5, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = p.alpha; }
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    for (let i = fireworks.length - 1; i >= 0; i--) {
      const f = fireworks[i]; f.px = f.x; f.py = f.y; f.x += f.vx * dt; f.y += f.vy * dt;
      f.vx *= Math.pow(.984, dt); f.vy = f.vy * Math.pow(.984, dt) + .018 * dt; f.life -= f.decay * dt;
      if (f.life <= 0) { fireworks.splice(i, 1); continue; }
      ctx.globalAlpha = f.life; ctx.strokeStyle = f.color; ctx.lineWidth = f.size;
      ctx.beginPath(); ctx.moveTo(f.px, f.py); ctx.lineTo(f.x, f.y); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    frame = requestAnimationFrame(render);
  }

  function setShape(next) {
    shape = next;
    document.querySelectorAll('.shape-button').forEach(b => { const active = b.dataset.shape === shape; b.classList.toggle('active', active); b.setAttribute('aria-pressed', String(active)); });
    $('#particle-caption').textContent = captions[shape]; formParticles();
  }
  document.querySelectorAll('.shape-button').forEach(button => button.addEventListener('click', () => {
    setShape(button.dataset.shape);
  }));

  function updatePointer(event) {
    const rect = canvas.getBoundingClientRect(); pointer.x = event.clientX - rect.left; pointer.y = event.clientY - rect.top; pointer.active = true;
  }
  canvas.addEventListener('pointermove', updatePointer);
  canvas.addEventListener('pointerdown', event => { updatePointer(event); pointer.down = true; pointer.startX = pointer.x; pointer.startY = pointer.y; });
  canvas.addEventListener('pointerup', event => {
    updatePointer(event);
    if (pointer.down && Math.hypot(pointer.x - pointer.startX, pointer.y - pointer.startY) < 15) burst(pointer.x, pointer.y);
    pointer.down = false; if (event.pointerType === 'touch') pointer.active = false;
  });
  canvas.addEventListener('pointerleave', () => { pointer.active = false; pointer.down = false; });
  canvas.addEventListener('pointercancel', () => { pointer.active = false; pointer.down = false; });
  $('.brand').addEventListener('click', event => { event.preventDefault(); setShape('nineteen'); celebrate(); });
  // The album connects the enter button after this document loads.
  $('#celebrate').addEventListener('click', () => { $('#letter-dialog').close(); celebrate(); announce('\u5341\u4E5D\u5C81\u751F\u65E5\u5FEB\u4E50\uFF01\u613F\u4F60\u6210\u4E3A\u81EA\u5DF1\u559C\u6B22\u7684\u6A21\u6837\u3002'); });
  document.querySelectorAll('.close-dialog').forEach(button => button.addEventListener('click', () => button.closest('dialog').close()));
  document.querySelectorAll('dialog').forEach(dialog => dialog.addEventListener('click', event => {
    if (event.target !== dialog) return; const rect = dialog.getBoundingClientRect();
    if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close();
  }));

  $('#fullscreen').addEventListener('click', async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
      else announce('\u5F53\u524D\u6D4F\u89C8\u5668\u6682\u4E0D\u652F\u6301\u5168\u5C4F\u3002');
    } catch { announce('\u5F53\u524D\u6D4F\u89C8\u5668\u672A\u80FD\u8FDB\u5165\u5168\u5C4F\uFF0C\u4ECD\u53EF\u7EE7\u7EED\u6B23\u8D4F\u3002'); }
  });
  document.addEventListener('fullscreenchange', () => {
    const label = document.fullscreenElement ? '\u9000\u51FA\u5168\u5C4F' : '\u5168\u5C4F\u6B23\u8D4F'; $('#fullscreen').title = label; $('#fullscreen').setAttribute('aria-label', label);
  });
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 120); });
  reduced.addEventListener('change', () => formParticles());
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { cancelAnimationFrame(frame); }
    else { lastTime = 0; frame = requestAnimationFrame(render); }
  });
  resize(); frame = requestAnimationFrame(render);
})();

<\/script>
